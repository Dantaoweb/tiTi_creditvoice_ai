<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a56db" />
  <title>CreditVoice — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c1f4a;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    p {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      max-width: 320px;
      line-height: 1.55;
    }
    .tip {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
    }
    button {
      margin-top: 8px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h1>You're offline</h1>
  <p>
    No internet connection right now. Your last-visited pages and data are still available — tap a cached page to continue working.
  </p>
  <p class="tip">Sales you record while offline will sync automatically when you reconnect.</p>
  <button onclick="window.location.href='/app/home'">Go to Home</button>
</body>
</html>
